services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    networks:
      - guardian_internal
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    networks:
      - guardian_internal
    restart: unless-stopped

networks:
  guardian_internal:
    driver: bridge
